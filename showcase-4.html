<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist 2D Motion Graphics</title>
    <style>
        :root {
            --deep: #174EA6;
            --primary: #1A73E8;
            --soft: #8AB4F8;
            --pale: #D2E3FC;
            --surface: #E8F0FE;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;
            background-color: var(--deep); overflow: hidden; font-family: system-ui, sans-serif;
        }
        .canvas {
            width: 100%; max-width: 500px; height: 100%; max-height: 500px; position: relative;
            background: radial-gradient(circle at 50% 50%, var(--primary) 0%, var(--deep) 100%);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); overflow: hidden;
            border-radius: 28px; border: 1px solid rgba(147, 197, 253, 0.12);
        }
        .glow {
            position: absolute; width: 380px; height: 380px; border-radius: 50%;
            background: var(--soft); filter: blur(80px); opacity: 0.25; pointer-events: none;
        }
        .comp { position: relative; width: 100%; height: 100%; max-width: 360px; max-height: 360px; display: flex; justify-content: center; align-items: center; }
        .ring {
            position: absolute; border-radius: 50%; border: 2px solid var(--soft); opacity: 0; pointer-events: none;
        }
        .core {
            position: absolute; width: 90px; height: 90px; background: var(--surface); border-radius: 50%;
            box-shadow: 0 20px 40px -10px rgba(23, 78, 166, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.9);
            display: flex; justify-content: center; align-items: center;
        }
        .dot { width: 32px; height: 32px; background: var(--primary); border-radius: 50%; }
        .morph {
            position: absolute; width: 180px; height: 60px; background: var(--pale); border-radius: 30px;
            box-shadow: 0 15px 30px -8px rgba(12, 27, 51, 0.4); opacity: 0; transform: scale(0.5);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
    <div class="canvas">
        <div class="glow" id="glow"></div>
        <div class="comp">
            <div class="ring" id="r1" style="width:120px;height:120px;"></div>
            <div class="ring" id="r2" style="width:120px;height:120px;"></div>
            <div class="morph" id="morph"></div>
            <div class="core" id="core"><div class="dot" id="dot"></div></div>
        </div>
    </div>
    <script>
        const FPS = 60, DURATION = 3;
        window.TOTAL_FRAMES = FPS * DURATION;

        const tl = gsap.timeline({ paused: true, repeat: -1 })
            .fromTo("#core", { scaleY: 0.2, scaleX: 1.8, opacity: 0, y: 60 }, { scaleY: 1, scaleX: 1, opacity: 1, y: 0, duration: 0.6, ease: "back.out(2.2)" }, 0)
            .fromTo("#dot", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 0.2)
            .to("#glow", { scale: 1.3, opacity: 0.4, duration: 0.8, ease: "power2.out" }, 0)
            
            .to("#r1", { width: 240, height: 240, opacity: 0.8, duration: 0.8, ease: "power2.out" }, 1)
            .to("#r1", { opacity: 0, scale: 1.1, duration: 0.4, ease: "power2.in" }, 1.4)
            .to("#r2", { width: 300, height: 300, opacity: 0.6, duration: 0.8, ease: "power2.out" }, 1.1)
            .to("#r2", { opacity: 0, scale: 1.1, duration: 0.4, ease: "power2.in" }, 1.6)
            .to("#core", { scale: 0, opacity: 0, duration: 0.3, ease: "back.in(1.5)" }, 1)
            .to("#morph", { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 1.1)
            
            .to("#morph", { scaleX: 1.15, scaleY: 0.85, duration: 0.3, yoyo: true, repeat: 1, ease: "power1.inOut" }, 1.8)
            .to("#glow", { scale: 1.6, opacity: 0.5, duration: 0.6, ease: "sine.inOut" }, 1.8)
            
            .to("#morph", { scaleY: 1.4, scaleX: 0.7, y: -20, duration: 0.25, ease: "power2.in" }, 2.4)
            .to("#morph", { scaleY: 0.2, scaleX: 1.6, y: 80, opacity: 0, duration: 0.35, ease: "power3.in" }, ">")
            .to("#glow", { opacity: 0.2, scale: 1, duration: 0.6, ease: "power2.out" }, 2.4);

        window.seekFrame = f => tl.seek(f / FPS);
        window.seekFrame(0);
        window.READY = true;
        window.__GSAP_TIMELINE__ = tl;
        window.startShowcase = () => { tl.restart(); tl.play(); };
        window.stopShowcase = () => { tl.pause(); tl.seek(0); };
    </script>
</body>
</html>
