<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Concentric Wave Motion</title>
    <style>
        :root {
            --bg-deep: #08102B;
            --primary: #2563EB;
            --accent: #3B82F6;
            --soft: #93C5FD;
            --surface: #F0F6FF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;
            background-color: var(--bg-deep); overflow: hidden; font-family: system-ui, sans-serif;
        }
        .canvas-frame {
            width: 100%; max-width: 600px; height: 100%; max-height: 600px; position: relative;
            background: radial-gradient(circle at 50% 50%, #12224A 0%, var(--bg-deep) 100%);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7); overflow: hidden;
            border-radius: 28px; border: 1px solid rgba(147, 197, 253, 0.12);
        }
        .ambient-glow {
            position: absolute; width: 450px; height: 450px; border-radius: 50%;
            background: var(--primary); filter: blur(100px); opacity: 0.15; pointer-events: none;
        }
        svg {
            width: 100%;
            height: 100%;
            max-width: 400px;
            max-height: 400px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
    <div class="canvas-frame">
        <div class="ambient-glow"></div>
        <svg viewBox="0 0 400 400" style="overflow:visible;">
            <defs>
                <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="10" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <!-- Concentric Cascade Rings -->
            <circle id="ring1" cx="200" cy="200" r="140" fill="none" stroke="var(--soft)" stroke-width="1.5" opacity="0.2" />
            <circle id="ring2" cx="200" cy="200" r="95" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0.3" />
            <circle id="ring3" cx="200" cy="200" r="50" fill="none" stroke="var(--surface)" stroke-width="2.5" opacity="0.4" />

            <!-- Rotating Orbital Nodes -->
            <g id="orbitGroup" transform="rotate(0 200 200)">
                <circle cx="200" cy="60" r="7" fill="var(--soft)" filter="url(#softGlow)" />
                <circle cx="200" cy="305" r="5" fill="var(--accent)" filter="url(#softGlow)" />
            </g>

            <!-- Central Morphing Core Polygon -->
            <polygon id="corePoly" points="200,160 234,220 166,220" fill="var(--primary)" filter="url(#softGlow)" />
            
            <!-- Central Focal Pulsar -->
            <circle id="pulsar" cx="200" cy="200" r="12" fill="var(--surface)" />
        </svg>
    </div>

    <script>
        const FPS = 60, DURATION = 3.2;
        window.TOTAL_FRAMES = FPS * DURATION;

        const tl = gsap.timeline({ paused: true, repeat: -1 })
            .fromTo("#corePoly", 
                { scale: 0, rotation: -180, opacity: 0, transformOrigin: "center center" }, 
                { scale: 1, rotation: 0, opacity: 1, duration: 0.8, ease: "back.out(2.4)" }, 0)
            .fromTo("#pulsar", 
                { scale: 0 }, 
                { scale: 1, duration: 0.6, ease: "back.out(1.8)" }, 0.2)
            .fromTo(["#ring1", "#ring2", "#ring3"], 
                { scale: 0.3, opacity: 0, transformOrigin: "center center" }, 
                { scale: 1, opacity: 0.35, duration: 0.9, stagger: 0.1, ease: "power3.out" }, 0.1)
            .to("#corePoly", { 
                rotation: 120, 
                scale: 1.25, 
                duration: 1.0, 
                ease: "power2.inOut" 
            }, 1.0)
            .to("#orbitGroup", { rotation: 270, duration: 1.4, ease: "power1.inOut" }, 1.0)
            .to(["#ring1", "#ring2"], { scale: 1.15, opacity: 0.15, duration: 0.7, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.1)
            .to("#pulsar", { scale: 1.35, duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.2)
            .to("#corePoly", { scaleY: 0.6, scaleX: 1.3, duration: 0.3, ease: "power2.in" }, 2.4)
            .to("#corePoly", { scale: 0, rotation: 240, opacity: 0, duration: 0.5, ease: "back.in(2)" }, 2.7)
            .to("#pulsar", { scale: 0, opacity: 0, duration: 0.4, ease: "back.in(2.5)" }, 2.7)
            .to(["#ring1", "#ring2", "#ring3"], { scale: 1.4, opacity: 0, duration: 0.5, ease: "power2.in" }, 2.7);

        window.seekFrame = f => tl.seek(f / FPS);
        window.seekFrame(0);
        window.READY = true;
        window.__GSAP_TIMELINE__ = tl;
        window.startShowcase = () => { tl.restart(); tl.play(); };
        window.stopShowcase = () => { tl.pause(); tl.seek(0); };
    </script>
</body>
</html>
