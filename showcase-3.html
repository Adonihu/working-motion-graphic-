<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Harmony Motion</title>
    <style>
        :root {
            --deep: #0D2B66;
            --primary: #2563EB;
            --soft: #60A5FA;
            --pale: #93C5FD;
            --surface: #DBEAFE;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;
            background-color: var(--deep); overflow: hidden; font-family: system-ui, sans-serif;
        }
        .canvas {
            width: 100%; max-width: 500px; height: 100%; max-height: 500px; position: relative;
            background: radial-gradient(circle at 50% 50%, var(--primary) 0%, var(--deep) 100%);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); overflow: hidden;
            border-radius: 28px; border: 1px solid rgba(147, 197, 253, 0.12);
        }
        .glow {
            position: absolute; width: 380px; height: 380px; border-radius: 50%;
            background: var(--soft); filter: blur(90px); opacity: 0.15; pointer-events: none;
        }
        .scene-container {
            position: relative; width: 100%; height: 100%; max-width: 360px; max-height: 360px;
            display: flex; justify-content: center; align-items: center;
        }
        svg {
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
    <div class="canvas">
        <div class="glow" id="glow"></div>
        <div class="scene-container">
            <svg viewBox="0 0 400 400" style="overflow:visible;">
                <!-- Background Ambient Orbit Ring -->
                <circle cx="200" cy="200" r="130" fill="none" stroke="var(--soft)" stroke-width="2" opacity="0.25" />
                
                <!-- Orbiting Satellite Node -->
                <circle id="satellite" cx="200" cy="70" r="10" fill="var(--pale)" />

                <!-- Central Morphing Polygon / Shape -->
                <path id="centralShape" d="M160,160 L240,160 L240,240 L160,240 Z" fill="var(--surface)" rx="16" />

                <!-- Inner Core Pulse Point -->
                <circle id="coreDot" cx="200" cy="200" r="24" fill="var(--primary)" />
            </svg>
        </div>
    </div>

    <script>
        const FPS = 60, DURATION = 3.2;
        window.TOTAL_FRAMES = FPS * DURATION;

        const tl = gsap.timeline({ paused: true, repeat: -1 })
            .fromTo("#centralShape", 
                { scaleX: 0.2, scaleY: 1.8, opacity: 0, transformOrigin: "center center" }, 
                { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.7, ease: "back.out(2)" }, 0)
            .fromTo("#coreDot", 
                { scale: 0 }, 
                { scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 0.2)
            .to("#glow", 
                { scale: 1.3, opacity: 0.35, duration: 0.8, ease: "power2.out" }, 0)
            .to("#centralShape", { rotation: 45, scale: 0.85, duration: 0.8, ease: "power2.inOut" }, 1.0)
            .to("#satellite", { 
                rotation: 360, transformOrigin: "200px 200px",
                duration: 1.6, ease: "power1.inOut" 
            }, 0.8)
            .to("#centralShape", { scaleX: 1.2, scaleY: 0.8, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.9)
            .to("#coreDot", { scale: 1.35, duration: 0.3, yoyo: true, repeat: 1, ease: "power2.out" }, 1.9)
            .to("#centralShape", { scaleX: 1.5, scaleY: 0.3, opacity: 0, duration: 0.4, ease: "back.in(1.8)" }, 2.6)
            .to("#coreDot", { scale: 0, opacity: 0, duration: 0.3, ease: "back.in(2)" }, 2.6)
            .to("#satellite", { scale: 0, opacity: 0, duration: 0.3, ease: "power2.in" }, 2.6)
            .to("#glow", { opacity: 0.15, scale: 1, duration: 0.5, ease: "power2.out" }, 2.6);

        window.seekFrame = f => tl.seek(f / FPS);
        window.seekFrame(0);
        window.READY = true;
        window.__GSAP_TIMELINE__ = tl;
        window.startShowcase = () => { tl.restart(); tl.play(); };
        window.stopShowcase = () => { tl.pause(); tl.seek(0); };
    </script>
</body>
</html>
