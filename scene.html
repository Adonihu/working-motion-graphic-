<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Motion Graphics Studio Scene</title>
    <style>body { margin: 0; overflow: hidden; background: #174EA6; }</style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { gsap } from 'gsap';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- FROZEN HARNESS (DO NOT MODIFY) ---
        const FPS = 60;
        const DURATION = 8;
        window.TOTAL_FRAMES = FPS * DURATION;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x174EA6);
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0x8AB4F8, 0.6);
        fillLight.position.set(-5, 2, -3);
        scene.add(fillLight);

        // Post-processing
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloom = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.8, 0.4, 0.85
        );
        composer.addPass(bloom);

        // --- AI EDIT ZONE START ---
        // Brand colors as Three.js hex (MANDATORY BRAND PALETTE)
        const BRAND = {
            deep: 0x174EA6,
            primary: 0x1A73E8,
            secondary: 0x4285F4,
            soft: 0x8AB4F8,
            pale: 0xD2E3FC,
            surface: 0xE8F0FE
        };

        const objects = {};

        // Camera target helper
        const cameraTarget = new THREE.Vector3(0, 0, 0);

        // --- 1. Background Grid & Atmospheric Fog ---
        scene.fog = new THREE.FogExp2(BRAND.deep, 0.045);

        const bgGroup = new THREE.Group();
        scene.add(bgGroup);

        // Horizon grid plane
        const gridHelper = new THREE.GridHelper(30, 40, BRAND.secondary, BRAND.primary);
        gridHelper.position.y = -3.2;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.25;
        gridHelper.material.blending = THREE.AdditiveBlending;
        bgGroup.add(gridHelper);

        // Depth background ring halos
        const bgRingsCount = 4;
        const bgRings = [];
        for (let i = 0; i < bgRingsCount; i++) {
            const rGeo = new THREE.RingGeometry(3.5 + i * 1.8, 3.55 + i * 1.8, 64);
            const rMat = new THREE.MeshBasicMaterial({
                color: i % 2 === 0 ? BRAND.primary : BRAND.soft,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.12 - i * 0.02,
                blending: THREE.AdditiveBlending
            });
            const rMesh = new THREE.Mesh(rGeo, rMat);
            rMesh.rotation.x = Math.PI / 2;
            rMesh.position.y = -3.15 + i * 0.05;
            bgGroup.add(rMesh);
            bgRings.push(rMesh);
        }

        // --- 2. Central Core Light ---
        const coreLight = new THREE.PointLight(BRAND.soft, 2.5, 12);
        coreLight.position.set(0, 0, 0);
        scene.add(coreLight);

        const rimLight = new THREE.PointLight(BRAND.pale, 1.8, 10);
        rimLight.position.set(0, 3, -2);
        scene.add(rimLight);

        // --- 3. Instanced Particle Quantum Swarm (800 particles) ---
        const PARTICLE_COUNT = 800;
        const particleGeo = new THREE.IcosahedronGeometry(0.045, 1);
        const particleMat = new THREE.MeshBasicMaterial({
            color: BRAND.soft,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        const particleSwarm = new THREE.InstancedMesh(particleGeo, particleMat, PARTICLE_COUNT);
        particleSwarm.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(particleSwarm);

        // Particle base trajectory data
        const particleData = [];
        const dummy = new THREE.Object3D();

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            // Spherical distribution with layered shells
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 1.2 + Math.pow(Math.random(), 2) * 5.5;

            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);

            particleData.push({
                basePos: new THREE.Vector3(x, y, z),
                speed: 0.5 + Math.random() * 1.5,
                angleOffset: Math.random() * Math.PI * 2,
                scale: 0.4 + Math.random() * 0.9,
                orbitRadius: Math.sqrt(x * x + z * z),
                yOffset: y
            });
        }

        // --- 4. Main Hero Quantum Nexus Core ---
        const coreRoot = new THREE.Group();
        scene.add(coreRoot);
        objects.coreRoot = coreRoot;

        // Inner Crystalline Polyhedron (Icosahedron)
        const innerGeo = new THREE.IcosahedronGeometry(0.85, 0);
        const innerMat = new THREE.MeshPhysicalMaterial({
            color: BRAND.surface,
            emissive: BRAND.secondary,
            emissiveIntensity: 0.35,
            metalness: 0.85,
            roughness: 0.15,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
            flatShading: true
        });
        const innerCore = new THREE.Mesh(innerGeo, innerMat);
        coreRoot.add(innerCore);
        objects.innerCore = innerCore;

        // Faceted wireframe exoskeleton cage
        const cageGeo = new THREE.IcosahedronGeometry(1.08, 0);
        const cageMat = new THREE.MeshBasicMaterial({
            color: BRAND.soft,
            wireframe: true,
            transparent: true,
            opacity: 0.75,
            blending: THREE.AdditiveBlending
        });
        const cageMesh = new THREE.Mesh(cageGeo, cageMat);
        coreRoot.add(cageMesh);
        objects.cageMesh = cageMesh;

        // Internal glowing seed
        const seedGeo = new THREE.OctahedronGeometry(0.45, 0);
        const seedMat = new THREE.MeshBasicMaterial({
            color: BRAND.pale,
            blending: THREE.AdditiveBlending
        });
        const seedMesh = new THREE.Mesh(seedGeo, seedMat);
        coreRoot.add(seedMesh);
        objects.seedMesh = seedMesh;

        // --- 5. Kinetic Gyroscopic Rings ---
        const ringsGroup = new THREE.Group();
        coreRoot.add(ringsGroup);
        objects.ringsGroup = ringsGroup;

        // Ring 1: Inner precision torus with metallic pale finish
        const ring1Geo = new THREE.TorusGeometry(1.4, 0.032, 16, 96);
        const ring1Mat = new THREE.MeshStandardMaterial({
            color: BRAND.pale,
            metalness: 0.92,
            roughness: 0.12
        });
        const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
        ringsGroup.add(ring1);
        objects.ring1 = ring1;

        // Ring 1 Satellites (4 glowing beads)
        const satGeo = new THREE.SphereGeometry(0.065, 16, 16);
        const satMat = new THREE.MeshBasicMaterial({ color: BRAND.soft });
        for (let i = 0; i < 4; i++) {
            const sat = new THREE.Mesh(satGeo, satMat);
            const angle = (i / 4) * Math.PI * 2;
            sat.position.set(Math.cos(angle) * 1.4, Math.sin(angle) * 1.4, 0);
            ring1.add(sat);
        }

        // Ring 2: Middle torus in Primary brand color
        const ring2Geo = new THREE.TorusGeometry(1.78, 0.038, 16, 96);
        const ring2Mat = new THREE.MeshStandardMaterial({
            color: BRAND.primary,
            metalness: 0.85,
            roughness: 0.2
        });
        const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
        ring2.rotation.x = Math.PI / 3;
        ringsGroup.add(ring2);
        objects.ring2 = ring2;

        // Ring 3: Outer segmented torus in Secondary accent
        const ring3Geo = new THREE.TorusGeometry(2.18, 0.045, 16, 96);
        const ring3Mat = new THREE.MeshStandardMaterial({
            color: BRAND.secondary,
            metalness: 0.88,
            roughness: 0.18
        });
        const ring3 = new THREE.Mesh(ring3Geo, ring3Mat);
        ring3.rotation.y = Math.PI / 4;
        ringsGroup.add(ring3);
        objects.ring3 = ring3;

        // Orbiting node points along outer perimeter
        const orbitNodesGroup = new THREE.Group();
        coreRoot.add(orbitNodesGroup);
        objects.orbitNodesGroup = orbitNodesGroup;

        const nodeGeo = new THREE.BoxGeometry(0.09, 0.09, 0.09);
        const nodeMat = new THREE.MeshStandardMaterial({
            color: BRAND.surface,
            emissive: BRAND.soft,
            emissiveIntensity: 0.6,
            metalness: 0.8,
            roughness: 0.2
        });
        const orbitNodes = [];
        const NODE_COUNT = 8;
        for (let i = 0; i < NODE_COUNT; i++) {
            const nMesh = new THREE.Mesh(nodeGeo, nodeMat);
            orbitNodesGroup.add(nMesh);
            orbitNodes.push(nMesh);
        }

        // --- 6. Energy Shockwave Ripples (Additive Rings) ---
        const shockwaveGroup = new THREE.Group();
        scene.add(shockwaveGroup);
        objects.shockwaveGroup = shockwaveGroup;

        const shock1Geo = new THREE.RingGeometry(0.1, 0.25, 64);
        const shock1Mat = new THREE.MeshBasicMaterial({
            color: BRAND.soft,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending
        });
        const shock1 = new THREE.Mesh(shock1Geo, shock1Mat);
        shockwaveGroup.add(shock1);
        objects.shock1 = shock1;

        const shock2Geo = new THREE.RingGeometry(0.1, 0.35, 64);
        const shock2Mat = new THREE.MeshBasicMaterial({
            color: BRAND.pale,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending
        });
        const shock2 = new THREE.Mesh(shock2Geo, shock2Mat);
        shock2.rotation.x = Math.PI / 2;
        shockwaveGroup.add(shock2);
        objects.shock2 = shock2;

        // --- 7. Sculptural Brand Emblem / Monolith Pillars ---
        const emblemGroup = new THREE.Group();
        emblemGroup.position.set(0, 0, 0);
        emblemGroup.scale.set(0.001, 0.001, 0.001);
        scene.add(emblemGroup);
        objects.emblemGroup = emblemGroup;

        // Stylized precision geometric crest bars
        const pillarMat = new THREE.MeshStandardMaterial({
            color: BRAND.surface,
            metalness: 0.9,
            roughness: 0.1,
            emissive: BRAND.primary,
            emissiveIntensity: 0.15
        });

        // 4 Architectural Chevron Wings
        const wingGeo = new THREE.BoxGeometry(0.18, 1.4, 0.18);
        const wings = [];
        for (let i = 0; i < 4; i++) {
            const wing = new THREE.Mesh(wingGeo, pillarMat);
            const a = (i * Math.PI) / 2;
            wing.position.set(Math.cos(a) * 0.9, Math.sin(a) * 0.9, 0);
            wing.rotation.z = a + Math.PI / 4;
            emblemGroup.add(wing);
            wings.push(wing);
        }

        // Diamond center jewel
        const diamondGeo = new THREE.OctahedronGeometry(0.5, 0);
        const diamondMat = new THREE.MeshPhysicalMaterial({
            color: BRAND.pale,
            metalness: 0.95,
            roughness: 0.05,
            transmission: 0.4,
            thickness: 0.8,
            emissive: BRAND.secondary,
            emissiveIntensity: 0.4
        });
        const diamond = new THREE.Mesh(diamondGeo, diamondMat);
        diamond.scale.set(0.7, 1.1, 0.7);
        emblemGroup.add(diamond);
        objects.diamond = diamond;

        // --- Particle Update Helper (Deterministic evaluation) ---
        function updateParticles(t, swirlFactor, burstFactor) {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const p = particleData[i];
                const angle = p.angleOffset + t * p.speed * swirlFactor;
                const r = p.orbitRadius * (1 + burstFactor * 1.8);
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                const y = p.yOffset * (1 + burstFactor * 0.5) + Math.sin(t * 2 + i) * 0.15;

                dummy.position.set(x, y, z);
                const s = p.scale * (1 + Math.sin(t * 3 + p.angleOffset) * 0.3);
                dummy.scale.set(s, s, s);
                dummy.updateMatrix();
                particleSwarm.setMatrixAt(i, dummy.matrix);
            }
            particleSwarm.instanceMatrix.needsUpdate = true;
        }

        // Initial particle seed
        updateParticles(0, 0.2, 0);

        // State holder for GSAP driven variables
        const animState = {
            time: 0,
            particleSwirl: 0.2,
            particleBurst: 0,
            bloomStrength: 0.8,
            coreGlow: 0.35,
            camTargetY: 0
        };

        // --- GSAP TIMELINE DEFINITION (PAUSED: TRUE) ---
        const tl = gsap.timeline({
            paused: true,
            onUpdate: () => {
                camera.lookAt(cameraTarget.x, animState.camTargetY, cameraTarget.z);
                bloom.strength = animState.bloomStrength;
                innerMat.emissiveIntensity = animState.coreGlow;
                updateParticles(animState.time, animState.particleSwirl, animState.particleBurst);

                // Update orbit nodes
                for (let i = 0; i < NODE_COUNT; i++) {
                    const angle = (i / NODE_COUNT) * Math.PI * 2 + animState.time * 1.2;
                    const r = 2.4 + Math.sin(animState.time * 2 + i) * 0.2;
                    orbitNodes[i].position.set(
                        Math.cos(angle) * r,
                        Math.sin(animState.time * 1.5 + i * 0.5) * 0.6,
                        Math.sin(angle) * r
                    );
                    orbitNodes[i].rotation.x = animState.time * 2;
                    orbitNodes[i].rotation.y = animState.time * 2.5;
                }
            }
        });

        // Dynamic time driver
        tl.to(animState, { time: DURATION, duration: DURATION, ease: "none" }, 0);

        // ==========================================
        // ACT 1: GENESIS & ASSEMBLY (0.0s - 2.6s)
        // ==========================================
        tl.set(coreRoot.scale, { x: 0.001, y: 0.001, z: 0.001 }, 0);
        tl.set(camera.position, { x: 0, y: 3.5, z: 10 }, 0);
        tl.set(animState, { camTargetY: 0, bloomStrength: 0.6 }, 0);

        // Camera dramatic establishing swoop
        tl.to(camera.position, {
            x: 1.8,
            y: 0.8,
            z: 7.2,
            duration: 2.6,
            ease: "power2.inOut"
        }, 0);

        // Core expands from quantum singularity with elastic recoil
        tl.to(coreRoot.scale, {
            x: 1,
            y: 1,
            z: 1,
            duration: 2.2,
            ease: "elastic.out(1, 0.75)"
        }, 0.2);

        // Cage & Inner Core Counter-Rotation
        tl.to(innerCore.rotation, {
            x: Math.PI * 1.5,
            y: Math.PI * 2.0,
            duration: 2.6,
            ease: "power1.inOut"
        }, 0);

        tl.to(cageMesh.rotation, {
            x: -Math.PI * 1.2,
            y: -Math.PI * 1.8,
            duration: 2.6,
            ease: "power1.inOut"
        }, 0);

        // Gyroscopic Rings spin up into orbit
        tl.to(ring1.rotation, { x: Math.PI * 2, y: Math.PI * 1.5, duration: 2.6, ease: "power2.inOut" }, 0.2);
        tl.to(ring2.rotation, { y: Math.PI * 2.2, z: Math.PI * 1.2, duration: 2.6, ease: "power2.inOut" }, 0.3);
        tl.to(ring3.rotation, { x: -Math.PI * 1.8, z: -Math.PI * 2.0, duration: 2.6, ease: "power2.inOut" }, 0.4);

        // ==========================================
        // ACT 2: QUANTUM FLUX & KINETIC ALIGNMENT (2.6s - 5.0s)
        // ==========================================
        // Camera moves to low-angle dynamic side view
        tl.to(camera.position, {
            x: -3.2,
            y: -1.2,
            z: 5.6,
            duration: 2.4,
            ease: "power2.inOut"
        }, 2.6);

        tl.to(animState, {
            camTargetY: 0.2,
            particleSwirl: 0.8,
            bloomStrength: 1.1,
            duration: 2.4,
            ease: "power1.inOut"
        }, 2.6);

        // Accelerate Ring Gimbal dynamics
        tl.to(ring1.rotation, { x: "+=" + (Math.PI * 3), y: "+=" + (Math.PI * 2), duration: 2.4, ease: "power1.inOut" }, 2.6);
        tl.to(ring2.rotation, { y: "+=" + (Math.PI * 2.5), z: "+=" + (Math.PI * 2.8), duration: 2.4, ease: "power1.inOut" }, 2.6);
        tl.to(ring3.rotation, { x: "+=" + (Math.PI * 2.2), z: "+=" + (Math.PI * 3.2), duration: 2.4, ease: "power1.inOut" }, 2.6);

        // Core morph breathing pulse
        tl.to(innerCore.scale, { x: 1.3, y: 1.3, z: 1.3, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.6);
        tl.to(cageMesh.scale, { x: 1.25, y: 1.25, z: 1.25, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.6);

        // Core light pulses
        tl.to(coreLight, { intensity: 5.0, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.6);
        tl.to(animState, { coreGlow: 0.9, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.6);

        // ==========================================
        // ACT 3: ENERGY FLARE & CREST REVEAL (5.0s - 7.0s)
        // ==========================================
        // Dramatic shockwave expansion
        tl.set(shock1.scale, { x: 0.1, y: 0.1, z: 0.1 }, 5.0);
        tl.set(shock1Mat, { opacity: 0.95 }, 5.0);
        tl.to(shock1.scale, { x: 28, y: 28, z: 28, duration: 1.6, ease: "power2.out" }, 5.0);
        tl.to(shock1Mat, { opacity: 0, duration: 1.6, ease: "power2.out" }, 5.0);

        tl.set(shock2.scale, { x: 0.1, y: 0.1, z: 0.1 }, 5.15);
        tl.set(shock2Mat, { opacity: 0.85 }, 5.15);
        tl.to(shock2.scale, { x: 22, y: 22, z: 22, duration: 1.5, ease: "power2.out" }, 5.15);
        tl.to(shock2Mat, { opacity: 0, duration: 1.5, ease: "power2.out" }, 5.15);

        // Particle super burst
        tl.to(animState, {
            particleBurst: 1.0,
            particleSwirl: 2.2,
            duration: 0.8,
            ease: "power3.out"
        }, 5.0);

        tl.to(animState, {
            particleBurst: 0.1,
            particleSwirl: 0.4,
            duration: 1.2,
            ease: "power2.out"
        }, 5.8);

        // Bloom flash and settling
        tl.to(animState, {
            bloomStrength: 2.2,
            duration: 0.25,
            ease: "power2.out"
        }, 5.0);

        tl.to(animState, {
            bloomStrength: 0.9,
            duration: 1.5,
            ease: "power2.out"
        }, 5.25);

        // Core seamlessly transforms / reveals brand emblem
        tl.to(innerCore.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 0.7, ease: "back.in(1.5)" }, 5.0);
        tl.to(cageMesh.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 0.7, ease: "back.in(1.5)" }, 5.0);

        // Rings expand outwards into framing halo
        tl.to(ring1.scale, { x: 1.5, y: 1.5, z: 1.5, duration: 1.4, ease: "power3.out" }, 5.0);
        tl.to(ring2.scale, { x: 1.4, y: 1.4, z: 1.4, duration: 1.4, ease: "power3.out" }, 5.1);
        tl.to(ring3.scale, { x: 1.35, y: 1.35, z: 1.35, duration: 1.4, ease: "power3.out" }, 5.2);

        // Emblem rises into hero focus
        tl.to(emblemGroup.scale, {
            x: 1.6,
            y: 1.6,
            z: 1.6,
            duration: 1.8,
            ease: "elastic.out(1, 0.8)"
        }, 5.2);

        tl.to(emblemGroup.rotation, {
            z: Math.PI * 2,
            y: Math.PI * 2,
            duration: 1.8,
            ease: "power2.out"
        }, 5.2);

        // Camera dollies to front hero position with slight deceleration
        tl.to(camera.position, {
            x: 0,
            y: 0,
            z: 6.2,
            duration: 2.0,
            ease: "power3.inOut"
        }, 5.0);

        tl.to(animState, {
            camTargetY: 0,
            duration: 2.0,
            ease: "power3.inOut"
        }, 5.0);

        // ==========================================
        // ACT 4: HERO CLIMAX & CINEMATIC HOLD (7.0s - 8.0s)
        // ==========================================
        // Subtle macro drift
        tl.to(camera.position, {
            z: 5.8,
            duration: 1.0,
            ease: "power1.out"
        }, 7.0);

        tl.to(emblemGroup.rotation, {
            y: "+=0.35",
            duration: 1.0,
            ease: "none"
        }, 7.0);

        tl.to(diamond.rotation, {
            x: "+=0.8",
            y: "+=1.2",
            duration: 1.0,
            ease: "none"
        }, 7.0);

        // Specular directional light sweep
        tl.to(dirLight.position, {
            x: -2,
            y: 4,
            z: 6,
            duration: 1.0,
            ease: "power1.inOut"
        }, 7.0);
        // --- AI EDIT ZONE END ---

        // --- FROZEN HARNESS (DO NOT MODIFY) ---
        window.seekFrame = function(frame) {
            tl.seek(frame / FPS);
            composer.render();
        };
        window.seekFrame(0);
        window.READY = true;
    </script>
</body>
</html>
