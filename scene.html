<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bank Animation - Complete 10s Timeline</title>
  
  <script>
    (function() {
      try {
        var origFetch = typeof window !== 'undefined' ? window.fetch : null;
        var customFetch = origFetch;
        if (origFetch) {
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return customFetch; },
              set: function(fn) { customFetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (e) {}
        }
      } catch (e) {}
    })();
  </script>

  <!-- GSAP 3.12.5 via CDN -->
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    /* BRAND PALETTE (STRICT)
       Off-White: #FAF9F6 (background only)
       Brand Green: #8DC63F (accent elements only)
       Black: #000000 (all text, icons, cursor)
       NO other colors. NO gradients unless explicitly requested.
    */
    :root {
      --bg-offwhite: #FAF9F6;
      --brand-green: #8DC63F;
      --brand-black: #000000;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #111418;
      color: var(--brand-black);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Container wrapping the 1920x1080 stage to scale responsively */
    #viewport-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fixed 1920x1080 Stage */
    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background-color: var(--bg-offwhite);
      overflow: hidden;
      transform-origin: center center;
      flex-shrink: 0;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    /* Master Zoom-Out Container for Scene 12 */
    #stage-zoom-wrapper {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      will-change: transform, opacity, filter;
    }

    /* Full Viewport Scene */
    #scene {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Scene 1: Centered Multi-Line Typography & Graphic Hierarchy */
    .hero-wrapper {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      transform-origin: center center;
      z-index: 10;
    }

    /* Top Line: "Bank 💸 slowing" */
    .headline-line-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-size: 96px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.035em;
      color: var(--brand-black);
      white-space: nowrap;
      perspective: 1000px;
    }

    /* Bottom Line: "you down?" + Bank Icon beside it */
    .headline-line-bottom {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-size: 96px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.035em;
      color: var(--brand-black);
      white-space: nowrap;
      perspective: 1000px;
    }

    .word-group {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      overflow: visible;
      padding: 0 2px;
    }

    /* Letter Mask: clean kinetic baseline mask for distinct letter-by-letter slide-up */
    .char-mask {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
      padding: 0 1px 4px 1px;
    }

    .char {
      display: inline-block;
      transform-origin: 0% 100%;
      will-change: transform, opacity;
      color: var(--brand-black);
    }

    /* 💸 Emoji styled to match 96px bold typography */
    .emoji-cash {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 96px;
      line-height: 1;
      vertical-align: middle;
      transform-origin: center center;
      will-change: transform, opacity;
    }

    /* Minimal Black Line-Art Bank Icon beside "down?" */
    .bank-icon-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 88px;
      height: 88px;
      margin-left: 4px;
      vertical-align: middle;
      transform-origin: center center;
      will-change: transform, opacity;
    }

    .bank-icon-svg {
      width: 84px;
      height: 84px;
      stroke: var(--brand-black);
      fill: none;
      stroke-width: 5px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Interactive Center Container */
    .center-stage-container {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
    }

    /* Action Buttons (Pill & Circle Morphs) */
    .action-btn {
      position: absolute;
      width: 380px;
      height: 104px;
      border-radius: 9999px; /* Fully rounded pill shape */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      transform-origin: center center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
      white-space: nowrap;
      user-select: none;
      will-change: transform, opacity, width, height, border-radius, border;
    }

    /* Left & Right Initial Buttons: Solid Black with off-white text */
    .btn-left, .btn-right {
      background-color: var(--brand-black);
      color: var(--bg-offwhite);
      z-index: 22;
    }

    /* High-Luminance Feathered Rotating Stroke Trail in #8DC63F */
    .add-funds-trail-svg {
      position: absolute;
      top: -24px;
      left: -24px;
      width: 428px;
      height: 152px;
      pointer-events: none;
      overflow: visible;
      z-index: 50;
      mix-blend-mode: color-dodge;
      filter: drop-shadow(0 0 16px #8DC63F) drop-shadow(0 0 36px rgba(141, 198, 63, 1));
    }

    .trail-path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      mix-blend-mode: color-dodge;
    }

    /* 1. Outer Ambient Layer: Thick stroke with heavy blur in #8DC63F */
    .trail-ambient {
      stroke: #8DC63F;
      stroke-width: 28px;
      opacity: 0.95;
      filter: url(#trail-glow-wide);
      mix-blend-mode: color-dodge;
    }

    /* 2. Mid Diffusion Layer: Medium thickness with moderate blur in #8DC63F */
    .trail-diffusion {
      stroke: #a4e54f;
      stroke-width: 15px;
      opacity: 1.0;
      filter: url(#trail-glow-mid);
      mix-blend-mode: color-dodge;
    }

    /* 3. Soft Core Layer: Concentrated stroke with slight blur in intense #8DC63F */
    .trail-core {
      stroke: #bcf36a;
      stroke-width: 7px;
      opacity: 1.0;
      filter: url(#trail-glow-soft);
      mix-blend-mode: color-dodge;
    }

    /* 4. Leading White Hotspot: Thin, pure white (#ffffff) head with micro-blur for incandescent core */
    .trail-hotspot {
      stroke: #ffffff;
      stroke-width: 4px;
      opacity: 1.0;
      filter: url(#trail-glow-core);
      mix-blend-mode: color-dodge;
    }

    /* Ghostly Outward Click Ripple Layers for Send Button */
    .click-ghost-aura {
      position: absolute;
      width: 380px;
      height: 104px;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 45;
      border: 3.5px solid #8DC63F;
      background: radial-gradient(ellipse at center, rgba(141, 198, 63, 0.45) 0%, rgba(141, 198, 63, 0.15) 55%, rgba(141, 198, 63, 0) 75%);
      box-shadow: 0 0 28px rgba(141, 198, 63, 0.9), inset 0 0 20px rgba(141, 198, 63, 0.6);
      opacity: 0;
      transform-origin: center center;
      mix-blend-mode: multiply;
      filter: blur(1.5px);
    }

    .click-ghost-core {
      position: absolute;
      width: 380px;
      height: 104px;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 46;
      border: 2px solid #ffffff;
      box-shadow: 0 0 20px rgba(141, 198, 63, 1), 0 0 40px rgba(141, 198, 63, 0.8);
      opacity: 0;
      transform-origin: center center;
      filter: blur(1px);
    }

    /* Center Button: Filled with Brand Green #8DC63F, bold black text */
    .btn-center {
      background-color: var(--brand-green);
      color: var(--brand-black);
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.025em;
      box-shadow: 0 18px 48px rgba(141, 198, 63, 0.35);
      z-index: 30;
      border: 0px solid #000000;
      overflow: hidden;
    }

    .btn-label-send {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      transform-origin: center center;
    }

    /* Center Circle Icons Stack */
    .center-icon-layer {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      opacity: 0;
      transform-origin: center center;
      pointer-events: none;
    }

    .center-icon-svg {
      width: 88px;
      height: 88px;
      stroke: var(--brand-black);
      fill: none;
      stroke-width: 4.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Orbit Wrapper for Smooth 360°/540° Carousels */
    .orbit-wrapper {
      position: absolute;
      width: 0;
      height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 25;
      transform-origin: 0px 0px;
      pointer-events: none;
    }

    /* Side Circles in Wheel Row */
    .side-circle {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background-color: var(--bg-offwhite);
      border: 3px solid var(--brand-black);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      transform-origin: center center;
      will-change: transform, opacity;
      opacity: 0;
    }

    .side-circle-inner {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }

    .side-circle-svg {
      width: 66px;
      height: 66px;
      stroke: var(--brand-black);
      fill: none;
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform-origin: center center;
    }

    /* Scene 8: Rapid Rolling Number Counter */
    .number-counter-wrapper {
      position: absolute;
      top: calc(50% + 150px);
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 35;
      pointer-events: none;
      opacity: 0;
    }

    .number-counter {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--brand-black);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-align: center;
      display: flex;
      align-items: baseline;
      justify-content: center;
    }

    .currency-unit {
      font-size: 28px;
      font-weight: 850;
      letter-spacing: -0.01em;
      margin-left: 8px;
      color: var(--brand-black);
      opacity: 0.9;
    }

    .number-counter-label {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brand-black);
      opacity: 0.6;
      margin-top: -2px;
    }

    /* Scene 10 & 11: Apple Pay style Brand Lockup & Kinetic Roller (Enlarged +30%) */
    .brand-finale-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      pointer-events: none;
      opacity: 0;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      transform-origin: center center;
    }

    /* TeleBirr Brand Logo Block (136px) */
    .brand-logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 136px;
      height: 136px;
      flex-shrink: 0;
      transform-origin: center center;
    }

    /* TeleBirr Brand Logo SVG (132px) */
    .brand-logo-svg {
      width: 132px;
      height: 132px;
      fill: var(--brand-black);
      stroke: var(--brand-black);
      stroke-width: 0.5px;
      transform-origin: center center;
    }

    /* Kinetic Vertical Roller Window (144px height, +30% enlarged) */
    .text-roller-window {
      position: relative;
      height: 144px;
      min-width: 540px;
      overflow: hidden;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.3) 12%, rgba(0, 0, 0, 1) 28%, rgba(0, 0, 0, 1) 72%, rgba(0, 0, 0, 0.3) 88%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.3) 12%, rgba(0, 0, 0, 1) 28%, rgba(0, 0, 0, 1) 72%, rgba(0, 0, 0, 0.3) 88%, transparent 100%);
    }

    .text-roller-track {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      width: 100%;
      transform-origin: left center;
      will-change: transform;
    }

    .roller-item {
      height: 144px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-size: 120px;
      font-weight: 850;
      letter-spacing: -0.04em;
      color: var(--brand-black);
      line-height: 1;
      white-space: nowrap;
      transform-origin: left center;
      will-change: transform, opacity, filter;
    }

    /* Scene 3: Minimalist Black SVG Cursor */
    .cursor-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      margin-top: -14px;
      margin-left: 24px;
      pointer-events: none;
      z-index: 50;
      transform-origin: 8px 4px;
      will-change: transform, opacity;
    }

    .cursor-svg {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.25));
    }
  </style>
</head>
<body>

  <!-- Responsive Scaling Viewport Wrapper -->
  <div id="viewport-wrapper">
    <!-- Fixed 1920x1080 Native Canvas Stage -->
    <div id="stage">
      
      <!-- Stage Master Zoom Wrapper for Scene 12 Closing Zoom-Out & Blur -->
      <div id="stage-zoom-wrapper">
        <div id="scene">
          
          <!-- Scene 1: Hero Hook Headline -->
          <div class="hero-wrapper" id="hero-wrapper">
            <!-- Line 1 (Top): "Bank" + 💸 + "slowing" -->
            <div class="headline-line-top" id="line-top">
              <span class="word-group" id="group-bank">
                <span class="char-mask"><span class="char">B</span></span><span class="char-mask"><span class="char">a</span></span><span class="char-mask"><span class="char">n</span></span><span class="char-mask"><span class="char">k</span></span>
              </span>
              <span class="char-mask"><span class="emoji-cash" id="emoji-cash">💸</span></span>
              <span class="word-group" id="group-slowing">
                <span class="char-mask"><span class="char">s</span></span><span class="char-mask"><span class="char">l</span></span><span class="char-mask"><span class="char">o</span></span><span class="char-mask"><span class="char">w</span></span><span class="char-mask"><span class="char">i</span></span><span class="char-mask"><span class="char">n</span></span><span class="char-mask"><span class="char">g</span></span>
              </span>
            </div>

            <!-- Line 2 (Bottom): "you down?" + Classical Bank Icon beside it -->
            <div class="headline-line-bottom" id="line-bottom">
              <span class="word-group" id="group-you">
                <span class="char-mask"><span class="char">y</span></span><span class="char-mask"><span class="char">o</span></span><span class="char-mask"><span class="char">u</span></span>
              </span>
              <span class="word-group" id="group-down">
                <span class="char-mask"><span class="char">d</span></span><span class="char-mask"><span class="char">o</span></span><span class="char-mask"><span class="char">w</span></span><span class="char-mask"><span class="char">n</span></span><span class="char-mask"><span class="char">?</span></span>
              </span>
              
              <span class="char-mask">
                <div class="bank-icon-container" id="bank-icon">
                  <svg class="bank-icon-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <!-- Triangle Roof / Pediment -->
                    <polygon points="32,6 6,22 58,22" />
                    <!-- Architrave / Entablature below roof -->
                    <line x1="10" y1="22" x2="54" y2="22" />
                    <line x1="8" y1="27" x2="56" y2="27" />
                    <!-- 4 Classical Columns -->
                    <line x1="15" y1="27" x2="15" y2="49" />
                    <line x1="26" y1="27" x2="26" y2="49" />
                    <line x1="38" y1="27" x2="38" y2="49" />
                    <line x1="49" y1="27" x2="49" y2="49" />
                    <!-- Stepped Base Foundation -->
                    <line x1="8" y1="49" x2="56" y2="49" />
                    <line x1="4" y1="55" x2="60" y2="55" />
                  </svg>
                </div>
              </span>
            </div>
          </div>

          <!-- Dynamic Center Assembly -->
          <div class="center-stage-container" id="center-stage-container">
            
            <!-- Orbit Parent Rig for Scenes 6, 7 & 8 Carousel -->
            <div class="orbit-wrapper" id="orbit-wrapper">
              <!-- Left Side Circle -->
              <div class="side-circle" id="circle-left">
                <div class="side-circle-inner" id="circle-left-inner">
                  <!-- Scene 7 Left Icon: "Send & Receive Money" (two arrows exchanging) -->
                  <svg class="side-circle-svg" id="icon-side-left" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <!-- Exchanging Arrows in dynamic loop -->
                    <path d="M14 24 L48 24 M40 16 L48 24 L40 32" />
                    <path d="M50 40 L16 40 M24 32 L16 40 L24 48" />
                  </svg>
                </div>
              </div>

              <!-- Right Side Circle -->
              <div class="side-circle" id="circle-right">
                <div class="side-circle-inner" id="circle-right-inner">
                  <!-- Scene 7 Right Icon: "Digital Microcredit (Loans)" (hand holding coin / credit) -->
                  <svg class="side-circle-svg" id="icon-side-right" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <!-- Coin above outstretched hand -->
                    <circle cx="32" cy="18" r="10" stroke-width="4" />
                    <line x1="32" y1="13" x2="32" y2="23" stroke-width="3" />
                    <!-- Hand line-art -->
                    <path d="M12 44 L26 44 L36 38 L48 38 C52 38, 54 41, 52 44 L44 50 L28 50 L12 44" />
                  </svg>
                </div>
              </div>
            </div>

            <!-- Left Pill Button: + Add Funds (Slides up in Scene 2, scatters in Scene 4) -->
            <div class="action-btn btn-left" id="btn-add-funds">
              <!-- High-Luminance Feathered Rotating Light Trail in #8DC63F (Scenes 2 to 3) -->
              <svg class="add-funds-trail-svg" id="add-funds-trail-svg" viewBox="-24 -24 428 152" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <!-- 1. Outer Ambient Layer Filter: Heavy Gaussian Blur -->
                  <filter id="trail-glow-wide" x="-60%" y="-60%" width="220%" height="220%">
                    <feGaussianBlur stdDeviation="14" />
                  </filter>
                  <!-- 2. Mid Diffusion Layer Filter: Moderate Gaussian Blur -->
                  <filter id="trail-glow-mid" x="-40%" y="-40%" width="180%" height="180%">
                    <feGaussianBlur stdDeviation="6" />
                  </filter>
                  <!-- 3. Soft Core Layer Filter: Slight Gaussian Blur -->
                  <filter id="trail-glow-soft" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="2" />
                  </filter>
                  <!-- 4. Leading White Hotspot Filter: Micro Gaussian Blur -->
                  <filter id="trail-glow-core" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="0.8" />
                  </filter>
                </defs>
                
                <g class="trail-stack-group" id="trail-stack-group">
                  <!-- Layer 1: Outer Ambient Layer (Thick stroke + wide atmospheric falloff in #8DC63F) -->
                  <path class="trail-path trail-ambient" d="M 52,0 L 328,0 A 52,52 0 0,1 380,52 A 52,52 0 0,1 328,104 L 52,104 A 52,52 0 0,1 0,52 A 52,52 0 0,1 52,0 Z" pathLength="1000" stroke-dasharray="350 650" />
                  <!-- Layer 2: Mid Diffusion Layer (Medium thickness + moderate blur in #8DC63F) -->
                  <path class="trail-path trail-diffusion" d="M 52,0 L 328,0 A 52,52 0 0,1 380,52 A 52,52 0 0,1 328,104 L 52,104 A 52,52 0 0,1 0,52 A 52,52 0 0,1 52,0 Z" pathLength="1000" stroke-dasharray="300 700" />
                  <!-- Layer 3: Soft Core Layer (Concentrated stroke + slight blur in intense #8DC63F) -->
                  <path class="trail-path trail-core" d="M 52,0 L 328,0 A 52,52 0 0,1 380,52 A 52,52 0 0,1 328,104 L 52,104 A 52,52 0 0,1 0,52 A 52,52 0 0,1 52,0 Z" pathLength="1000" stroke-dasharray="250 750" />
                  <!-- Layer 4: Leading White Hotspot (Pure white #ffffff head + glaring hot core) -->
                  <path class="trail-path trail-hotspot" d="M 52,0 L 328,0 A 52,52 0 0,1 380,52 A 52,52 0 0,1 328,104 L 52,104 A 52,52 0 0,1 0,52 A 52,52 0 0,1 52,0 Z" pathLength="1000" stroke-dasharray="80 920" />
                </g>
              </svg>
              <span class="btn-text-content" style="position: relative; z-index: 10;">+ Add Funds</span>
            </div>

            <!-- Ghostly Outward Click Echo Rings (Scene 3 Send Button Click Accent) -->
            <div class="click-ghost-aura" id="click-ghost-1"></div>
            <div class="click-ghost-aura" id="click-ghost-2"></div>
            <div class="click-ghost-core" id="click-ghost-core"></div>

            <!-- Center Button: Send (Morphs to 240px Circle & displays carousel icons) -->
            <div class="action-btn btn-center" id="btn-send">
              <!-- Text Label (Fades out in Scene 5) -->
              <div class="btn-label-send" id="label-send">

      stage.style.transform = `scale(${scale})`;
      stage.style.transformOrigin = 'center center';

    window.addEventListener('resize', resizeStage);
    resizeStage();

    const updateUI = () => {

      }
    };

      } else {
        for (let i = 0; i < timelineCompleteListeners.length; i++) {

    });

    // -------------------------------------------------------------
    // STUDIO HARNESS INTEGRATION API HOOKS
    // -------------------------------------------------------------
    const timelineUpdateListeners = [];
    const timelineCompleteListeners = [];

    window.onTimelineUpdate = function(cb) {
      if (typeof cb === 'function') timelineUpdateListeners.push(cb);
    };

    window.onTimelineComplete = function(cb) {
      if (typeof cb === 'function') timelineCompleteListeners.push(cb);
    };

    window.setLooping = function(loop) {

    };

    window.playNative = function(speed = 1.0) {
      tl.timeScale(speed);
      if (tl.progress() >= 0.999) {
        tl.restart();
      } else {
        tl.play();
      }
    };

    window.pauseNative = function() {

      const clamped = Math.max(0, Math.min(TOTAL_FRAMES - 1, frame));
      const targetTime = (clamped / TOTAL_FRAMES) * TOTAL_DURATION;
      tl.pause();
      tl.time(targetTime);
      updateUI();
    };
