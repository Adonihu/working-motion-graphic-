<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Magnetic Convergence</title>
    <style>
        :root {
            --bg-deep: #060E21;
            --primary: #1D4ED8;
            --accent: #3B82F6;
            --soft: #93C5FD;
            --surface: #F8FAFC;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;
            background-color: var(--bg-deep); overflow: hidden; font-family: system-ui, sans-serif;
        }
        .canvas-frame {
            width: 100%; max-width: 500px; height: 100%; max-height: 500px; position: relative;
            background: radial-gradient(circle at 50% 50%, #0F172A 0%, var(--bg-deep) 100%);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7); overflow: hidden;
            border-radius: 28px; border: 1px solid rgba(147, 197, 253, 0.12);
        }
        .ambient-glow {
            position: absolute; width: 380px; height: 380px; border-radius: 50%;
            background: var(--primary); filter: blur(100px); opacity: 0.18; pointer-events: none;
        }
        svg {
            width: 100%;
            height: 100%;
            max-width: 360px;
            max-height: 360px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
    <div class="canvas-frame">
        <div class="ambient-glow"></div>
        <svg viewBox="0 0 400 400" style="overflow:visible;">
            <defs>
                <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="10" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <!-- Background Magnetic Grid Orbs -->
            <circle id="nodeLeft" cx="130" cy="200" r="16" fill="var(--soft)" opacity="0.4" filter="url(#softGlow)" />
            <circle id="nodeRight" cx="270" cy="200" r="16" fill="var(--accent)" opacity="0.4" filter="url(#softGlow)" />

            <!-- Expanding Convergence Shockwave Ring -->
            <circle id="shockwave" cx="200" cy="200" r="20" fill="none" stroke="var(--soft)" stroke-width="2" opacity="0" />

            <!-- Central Morphing Capsule Container -->
            <rect id="capsule" x="150" y="185" width="100" height="30" rx="15" fill="none" stroke="var(--surface)" stroke-width="3.5" stroke-linejoin="round" filter="url(#softGlow)" />

            <!-- Core Focal Energy Spark -->
            <circle id="coreSpark" cx="200" cy="200" r="6" fill="var(--surface)" filter="url(#softGlow)" opacity="0" />
        </svg>
    </div>

    <script>
        const FPS = 60, DURATION = 3.2;
        window.TOTAL_FRAMES = FPS * DURATION;

        const tl = gsap.timeline({ paused: true, repeat: -1 })
            // Phase 1: Magnetic Attraction & Capsule Scale-in (0s - 1.0s)
            .fromTo("#capsule", 
                { scale: 0.2, opacity: 0, transformOrigin: "center center" }, 
                { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.8)" }, 0)
            .fromTo(["#nodeLeft", "#nodeRight"], 
                { scale: 0, opacity: 0 }, 
                { scale: 1, opacity: 0.6, duration: 0.6, stagger: 0.1, ease: "back.out(2)" }, 0.1)
            
            // Phase 2: Compression & Squash Magnetic Snap (1.0s - 1.8s)
            .to("#nodeLeft", { x: 50, duration: 0.5, ease: "power3.in" }, 0.9)
            .to("#nodeRight", { x: -50, duration: 0.5, ease: "power3.in" }, 0.9)
            .to("#capsule", { scaleX: 1.25, scaleY: 0.75, duration: 0.3, ease: "power2.in" }, 1.3)

            // Phase 3: Energy Ignition & Shockwave Burst (1.8s - 2.6s)
            .to("#capsule", { scaleX: 0.9, scaleY: 1.15, rotation: 90, duration: 0.4, ease: "back.out(2.5)" }, 1.6)
            .to("#coreSpark", { scale: 3.5, opacity: 1, duration: 0.25, ease: "power2.out" }, 1.7)
            .to("#shockwave", { r: 120, opacity: 0.6, duration: 0.6, ease: "power2.out" }, 1.7)
            .to("#shockwave", { opacity: 0, duration: 0.3 }, 2.3)

            // Phase 4: Clean Exit Squash & Reset (2.6s - 3.2s)
            .to(["#nodeLeft", "#nodeRight", "#capsule", "#coreSpark"], { 
                scale: 0, 
                opacity: 0, 
                duration: 0.4, 
                ease: "back.in(2.2)", 
                stagger: 0.05 
            }, 2.6);

        window.seekFrame = f => tl.seek(f / FPS);
        window.seekFrame(0);
        window.READY = true;
        window.__GSAP_TIMELINE__ = tl;
        window.startShowcase = () => { tl.restart(); tl.play(); };
        window.stopShowcase = () => { tl.pause(); tl.seek(0); };
    </script>
</body>
</html>
