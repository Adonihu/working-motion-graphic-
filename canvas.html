<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function() {
      try {
        var _fetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get: function() { return _fetch; },
          set: function(fn) { _fetch = fn; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {}
    })();
  </script>
  <title>Motion Graphics UI Studio - 720x720 Canvas</title>
  <!-- Google Fonts: Editorial & Display Pairings for High-Impact Motion Design -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Outfit:wght@700;800;900&family=Playfair+Display:ital,wght@1,600;1,700;1,800&family=Plus+Jakarta+Sans:wght@500;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* Reset & Viewport Canvas Centering */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 32%, #2067d4 0%, #174EA6 48%, #0b275b 82%, #061635 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Outfit", "SF Pro Display", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* 1:1 Square Canvas Stage (720x720px with responsive fit & 3D Perspective Stage) */
    .canvas-container {
      width: 720px;
      height: 720px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      perspective-origin: 50% 50%;
      /* Premium Cinematic Blue Radial Vignette */
      background: radial-gradient(circle at 50% 32%, #2067d4 0%, #174EA6 48%, #0b275b 82%, #061635 100%);
      box-shadow: 0 35px 90px -15px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      flex-shrink: 0;
    }

    /* =========================================================================
       3D VIRTUAL CAMERA RIG & SPATIAL WORLD COORDINATES
       ========================================================================= */
    .camera-rig {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform, filter;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .world-space {
      position: absolute;
      width: 800px;
      height: 800px;
      transform-style: preserve-3d;
      will-change: transform;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================================================================
       DEPTH OF FIELD (DoF) ATMOSPHERIC & OPTICAL BOKEH LAYERS
       ========================================================================= */
    .dof-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transform-style: preserve-3d;
    }

    /* Deep Background Plane (Z: -160px) spanning both Zone 1 & Zone 2 */
    .dof-bg-plane {
      transform: translateZ(-160px) scale(1.2);
    }

    /* Foreground Out-of-Focus Bokeh Plane (Z: +80px) */
    .dof-fg-plane {
      transform: translateZ(80px) scale(0.95);
      z-index: 30;
    }

    /* Ambient Background Glow Spotlights */
    .ambient-spotlight {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: screen;
      will-change: transform, opacity;
    }

    .spotlight-top {
      width: 540px;
      height: 540px;
      background: radial-gradient(circle, rgba(138, 180, 248, 0.38) 0%, rgba(138, 180, 248, 0) 70%);
      top: 8%;
      left: 16%;
      filter: blur(75px);
    }

    .spotlight-bottom {
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, rgba(66, 133, 244, 0.3) 0%, rgba(66, 133, 244, 0) 70%);
      bottom: 6%;
      right: 16%;
      filter: blur(65px);
    }

    .spotlight-zone2 {
      width: 650px;
      height: 520px;
      background: radial-gradient(ellipse at 50% 50%, rgba(138, 180, 248, 0.42) 0%, rgba(26, 115, 232, 0.25) 50%, rgba(23, 78, 166, 0) 75%);
      top: 680px;
      left: 10%;
      filter: blur(70px);
    }

    /* =========================================================================
       SPATIAL ZONE 1: 3D UI COMPOSITION STAGE (ANCHORED AT Y: 0, Z: 0px to +40px)
       ========================================================================= */
    .composition-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      z-index: 10;
    }

    /* Horizontal Interactive Row (Back Circle + Search Bar + Copy Circle) */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 50px;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* Circular Action Buttons (48px circle) */
    .icon-circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #E8F0FE;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transform: translateZ(24px);
      box-shadow: 
        0 14px 30px rgba(10, 38, 90, 0.38),
        0 4px 10px rgba(0, 0, 0, 0.1),
        inset 0 1.5px 1.5px rgba(255, 255, 255, 0.95),
        inset 0 -1.5px 2.5px rgba(23, 78, 166, 0.18);
      flex-shrink: 0;
      transform-style: preserve-3d;
      will-change: transform, box-shadow;
    }

    /* Central Search Bar (400px wide, 56px tall, 28px radius, Elevated Z-Plane) */
    .search-bar {
      width: 400px;
      height: 56px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(232, 240, 254, 0.95) 0%, rgba(210, 227, 252, 0.92) 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
      transform: translateZ(36px);
      transform-style: preserve-3d;
      will-change: transform, box-shadow;
      overflow: hidden;
      box-shadow: 
        0 22px 50px rgba(8, 30, 75, 0.44),
        0 8px 18px rgba(0, 0, 0, 0.12),
        inset 0 2px 4px rgba(23, 78, 166, 0.16),
        inset 0 1px 2px rgba(23, 78, 166, 0.22),
        inset 0 -1.5px 2px rgba(255, 255, 255, 0.95);
    }

    /* Scene 1: Fluid Multi-Stop Gradient Field with Drifting Anchor Points & Ultra-Vibrant Brand Palette */
    .search-fluid-gradient-field {
      position: absolute;
      inset: -30%;
      width: 160%;
      height: 160%;
      border-radius: 36px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.92;
      mix-blend-mode: soft-light;
      filter: blur(8px) saturate(2.4) contrast(1.15);
      background-size: 260% 260%;
      background-image: radial-gradient(
        circle at 25% 35%, 
        #A8C7FA 0%, 
        #3B82F6 45%, 
        #1D4ED8 80%,
        #174EA6 100%
      );
      will-change: background-position, filter, transform;
    }

    /* Dynamic Specular Glass Sheen Highlight Sweep */
    .glass-sheen {
      position: absolute;
      top: 0;
      left: -160px;
      width: 90px;
      height: 100%;
      background: linear-gradient(
        90deg, 
        rgba(255, 255, 255, 0) 0%, 
        rgba(255, 255, 255, 0.55) 50%, 
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-24deg);
      pointer-events: none;
      border-radius: 28px;
      opacity: 0;
      mix-blend-mode: overlay;
      filter: blur(1.5px);
      will-change: transform, left, opacity;
      z-index: 3;
    }

    /* Search Bar Reactive Backlight Aura */
    .search-backlight {
      position: absolute;
      inset: -14px -22px;
      border-radius: 42px;
      background: radial-gradient(ellipse at 50% 50%, rgba(138, 180, 248, 0.45) 0%, rgba(26, 115, 232, 0) 75%);
      filter: blur(16px);
      opacity: 0;
      pointer-events: none;
      z-index: -1;
      mix-blend-mode: screen;
      will-change: opacity, transform;
    }

    /* Placeholder Lines */
    .placeholder-indicator {
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
      z-index: 2;
      transform: translateZ(6px);
    }

    .placeholder-line {
      height: 2px;
      background-color: #1A73E8;
      border-radius: 2px;
    }

    .line-1 { width: 32px; opacity: 0.95; }
    .line-2 { width: 44px; opacity: 0.65; }
    .line-3 { width: 22px; opacity: 0.40; }

    /* Inside Right: Refresh/Rewind Icon Wrapper */
    .search-action-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      z-index: 2;
      transform: translateZ(6px);
    }

    .ui-icon {
      stroke: #1A73E8;
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .glow-arc-overlay {
      position: absolute;
      inset: -4px;
      width: calc(100% + 8px);
      height: calc(100% + 8px);
      pointer-events: none;
      overflow: visible;
      mix-blend-mode: screen;
      opacity: 0;
      z-index: 3;
      transform: translateZ(8px);
    }

    .search-reveal-text {
      position: absolute;
      left: 60px;
      top: 50%;
      transform: translateY(-50%) translateZ(8px);
      display: inline-flex;
      align-items: baseline;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.015em;
      color: #174EA6;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      z-index: 2;
    }

    .char-unit {
      display: inline-block;
      opacity: 0;
      color: #174EA6;
      text-shadow: 0 1px 1.5px rgba(255, 255, 255, 0.65);
      transform-origin: center bottom;
      will-change: color, text-shadow, opacity, transform;
    }

    .char-unit.space {
      width: 0.26em;
    }

    /* =========================================================================
       SPATIAL ZONE 2: 3D TYPOGRAPHY & CLIMAX STAGE (ANCHORED AT Y: 720px, Z: 20px)
       ========================================================================= */
    .cooked-hero-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 800px;
      height: 800px;
      /* Positioned naturally in 3D world space at Y: +720px */
      transform: translate(-50%, calc(-50% + 720px)) translateZ(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transform-style: preserve-3d;
      z-index: 20;
    }

    .cooked-hero-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      position: relative;
    }

    /* Kinetic Atmospheric Backlight Flare */
    .cooked-backlight {
      position: absolute;
      width: 640px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 50%, rgba(66, 133, 244, 0.55) 0%, rgba(26, 115, 232, 0.3) 40%, rgba(23, 78, 166, 0) 72%);
      filter: blur(42px);
      mix-blend-mode: screen;
      opacity: 0.45;
      pointer-events: none;
      z-index: -1;
      transform: translateZ(-20px);
      will-change: opacity, transform;
    }

    /* Scene 2: Fluid Multi-Stop Gradient Field rising from bottom to 25% height of canvas (200px) */
    .cooked-fluid-gradient-field {
      position: absolute;
      bottom: 0px;
      left: 0px;
      width: 800px;
      height: 0px; /* Animated to 200px (25% of 800px) */
      border-radius: 60px 60px 0 0;
      pointer-events: none;
      z-index: -1;
      opacity: 0;
      mix-blend-mode: screen;
      filter: blur(24px);
      background-size: 260% 260%;
      background-image: radial-gradient(
        ellipse at 50% 100%, 
        #8AB4F8 0%, 
        #4285F4 50%, 
        #1A73E8 100%
      );
      will-change: height, opacity, background-position, filter;
    }

    /* Shockwave Ripple Ring on Camera Arrival */
    .cooked-shockwave {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 2.5px solid #8AB4F8;
      box-shadow: 0 0 30px #4285F4, inset 0 0 20px #8AB4F8;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
      mix-blend-mode: screen;
      transform: translateZ(-10px) scale(0.2);
      will-change: transform, opacity;
    }

    /* Font 1: Bold Modern Display Sans for "EDITORS" */
    .word-editors-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateZ(40px);
      transform-style: preserve-3d;
    }

    .word-editors {
      font-family: 'Outfit', -apple-system, sans-serif;
      font-size: 66px;
      font-weight: 900;
      letter-spacing: -0.028em;
      text-transform: uppercase;
      line-height: 1.0;
      filter: drop-shadow(0 4px 16px rgba(138, 180, 248, 0.45)) drop-shadow(0 14px 28px rgba(0, 0, 0, 0.55));
      user-select: none;
      white-space: nowrap;
      position: relative;
      display: inline-flex;
      align-items: baseline;
    }

    .hero-char {
      display: inline-block;
      opacity: 0;
      filter: blur(32px);
      transform: translateY(48px) scale(0.88);
      will-change: transform, opacity, filter;
      background: linear-gradient(180deg, #FFFFFF 0%, #E8F0FE 48%, #8AB4F8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0.5px;
      transform-origin: center bottom;
    }

    /* Font 2: Editorial Italic Serif for "are cooked" */
    .phrase-cooked-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
      transform: translateZ(48px);
      transform-style: preserve-3d;
    }

    .word-are-cooked {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 54px;
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.1;
      user-select: none;
      white-space: nowrap;
      position: relative;
      display: inline-flex;
      align-items: baseline;
      -webkit-text-stroke: 0.5px #FFFFFF;
    }

    .sub-char {
      display: inline-block;
      opacity: 0;
      filter: blur(28px);
      transform: translateY(38px) scale(0.9);
      will-change: transform, opacity, filter;
      color: #8AB4F8;
      -webkit-text-stroke: 0.5px #FFFFFF;
      text-shadow: 
        0 0 30px rgba(138, 180, 248, 0.85),
        0 0 60px rgba(26, 115, 232, 0.6),
        0 6px 16px rgba(0, 0, 0, 0.6);
      transform-origin: center bottom;
    }

    .sub-char.space {
      width: 0.28em;
    }

    /* Shimmer streak disabled */
    .cooked-shimmer {
      display: none !important;
    }

    /* Crying Emoji Glyph with Dynamic Particle Bounce */
    .crying-emoji-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      user-select: none;
    }

    .crying-emoji {
      font-size: 58px;
      display: inline-block;
      transform-origin: center bottom;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 20px rgba(138, 180, 248, 0.5));
      will-change: transform;
    }

    /* Floating Teardrop Glow Motes */
    .tear-mote {
      position: absolute;
      width: 7px;
      height: 11px;
      background: linear-gradient(180deg, #FFFFFF 0%, #8AB4F8 100%);
      border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
      opacity: 0;
      filter: drop-shadow(0 0 6px #8AB4F8);
      pointer-events: none;
      will-change: transform, opacity;
    }

    .tear-left {
      left: 12px;
      top: 36px;
    }

    .tear-right {
      right: 12px;
      top: 36px;
    }

    /* =========================================================================
       SHOWCASE 4-CANVA MORPHING STAGE & 1:1 ROUNDED RECTANGLE CARDS
       ========================================================================= */
    .showcase-stage-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-50% + 56px));
      width: 580px;
      height: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    .showcase-ambient-glow {
      position: absolute;
      width: 540px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(26, 115, 232, 0.32) 0%, rgba(138, 180, 248, 0.14) 45%, rgba(6, 14, 33, 0) 75%);
      filter: blur(60px);
      opacity: 0;
      pointer-events: none;
    }

    .showcase-grid {
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: 16px;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
    }

    .showcase-card {
      position: relative;
      width: 270px;
      height: 145px;
      border-radius: 18px;
      background: #08102B;
      border: 1.5px solid rgba(138, 180, 248, 0.28);
      box-shadow: 
        0 16px 36px -8px rgba(0, 0, 0, 0.7),
        0 0 24px rgba(26, 115, 232, 0.18),
        inset 0 1px 2px rgba(232, 240, 254, 0.25);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      filter: blur(32px);
      transform: translateY(48px) scale(0.92);
      will-change: width, height, border-radius, transform, opacity, filter;
      box-sizing: border-box;
      pointer-events: auto;
    }

    .showcase-inner-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #060E21;
    }

    .showcase-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      border-radius: inherit;
      pointer-events: none;
      background: transparent;
    }

    .showcase-card-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(6, 14, 33, 0.45) 100%);
      pointer-events: none;
      border-radius: inherit;
    }

    /* White horizontal highlight streak removed from video elements to prevent visual distraction */
    .showcase-sheen-sweep {
      display: none !important;
    }

    .showcase-border-pulse {
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      border: 2px solid #8AB4F8;
      opacity: 0;
      pointer-events: none;
      filter: blur(2px);
    }

    /* Scene 2 & 3 Behind 4-Canvas: Heavily Blurred Fluid Multi-Stop Gradient Field on Background Layer */
    .showcase-fluid-gradient-field {
      position: absolute;
      width: 820px;
      height: 700px;
      border-radius: 50%;
      pointer-events: none;
      z-index: -2;
      opacity: 0;
      mix-blend-mode: screen;
      filter: blur(55px);
      background-size: 260% 260%;
      background-image: radial-gradient(
        circle at 50% 50%, 
        rgba(138, 180, 248, 0.70) 0%, 
        rgba(66, 133, 244, 0.50) 45%, 
        rgba(26, 115, 232, 0.30) 75%, 
        transparent 100%
      );
      will-change: opacity, background-position, filter, transform;
    }

    /* =========================================================================
       SPATIAL ZONE 3: FINAL SCENE (ANCHORED AT Y: -720px)
       ========================================================================= */
    .final-scene-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-50% - 720px)) translateZ(20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transform-style: preserve-3d;
      z-index: 30;
    }

    .final-backlight {
      position: absolute;
      width: 560px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 50%, rgba(138, 180, 248, 0.4) 0%, rgba(66, 133, 244, 0.2) 45%, rgba(26, 115, 232, 0) 75%);
      filter: blur(44px);
      mix-blend-mode: screen;
      opacity: 0;
      pointer-events: none;
      transform: translateZ(-20px);
      z-index: -2;
    }

    /* Final Scene Ambient Fluid Gradient Field on Background Layer (Heavily Blurred) */
    .final-fluid-gradient-field {
      position: absolute;
      width: 640px;
      height: 380px;
      border-radius: 50%;
      pointer-events: none;
      z-index: -2;
      opacity: 0;
      mix-blend-mode: screen;
      filter: blur(48px);
      background-size: 260% 260%;
      background-image: radial-gradient(
        ellipse at 50% 50%, 
        rgba(138, 180, 248, 0.70) 0%, 
        rgba(66, 133, 244, 0.48) 45%, 
        rgba(26, 115, 232, 0.25) 75%, 
        transparent 100%
      );
      will-change: opacity, background-position, filter, transform;
    }

    .final-text-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transform-style: preserve-3d;
      z-index: 2;
    }

    .final-words-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 16px;
      user-select: none;
      white-space: nowrap;
    }

    .final-word {
      display: inline-block;
      opacity: 0;
      filter: blur(32px);
      transform: translateY(48px) scale(0.88);
      will-change: transform, opacity, filter;
      transform-origin: center bottom;
    }

    /* Font Combo: Bold Display Sans for "COMMENT" */
    .final-word.word-comment {
      font-family: 'Outfit', 'Syne', -apple-system, sans-serif;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #FFFFFF 0%, #E8F0FE 48%, #8AB4F8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 14px rgba(138, 180, 248, 0.5)) drop-shadow(0 10px 24px rgba(0, 0, 0, 0.55));
    }

  <!-- GSAP Master Motion Graphics Engine with 3D Camera Travel, Physics & Shutter Blur -->
  <script>
    // Master timeline orchestrated at 60 FPS (6.3s = 378 Frames total)
    const tl = gsap.timeline({ 
      paused: true,
      defaults: { ease: "power2.out" }
    });

    // 3D Camera Rig Position & Orientation State Model
    const cameraState = {
      x: 0,
      y: 0,
      z: 0,
      pitchX: 0,
      yawY: 0,
      rollZ: 0,
      shutterBlurX: 0,
      shutterBlurY: 0,
      uiBlurY: 0,
      heroBlurY: 0
    };

    // Reactive State Model for Dynamic SVG Morph & Accent Blur
    const morphData = {
      isGrowing: true,
      leftX: 400,
      rightX: 400,
      centerX: 200,
      centerY: 0,
      radiusX: 0,
      radiusY: 0,
      scaleX: 1.0,
      scaleY: 1.0,
      cornerRadius: 0,
      fillColor: '#8AB4F8',
      strokeColor: '#8AB4F8',
      strokeWidth: 0,
      fillOpacity: 1,
      blurX: 0,
      blurY: 0
    };

    // Typing State Controller
    const textState = {
      typeProgress: 0
    };

    const cameraRig = document.getElementById('camera-rig');
    const cameraBlurNode = document.getElementById('camera-blur-node');
    const uiBlurNode = document.getElementById('ui-blur-node');
    const heroBlurNode = document.getElementById('hero-blur-node');
    const blurFilterNode = document.getElementById('blur-filter-node');

    function updateCamera() {
      if (cameraRig) {
        // Apply 3D camera translation & rotation matrix
        // Note: Moving the camera down (+Y in world) means translating the camera-rig upwards (-Y)
        cameraRig.style.transform = `translate3d(${(-cameraState.x).toFixed(2)}px, ${(-cameraState.y).toFixed(2)}px, ${(-cameraState.z).toFixed(2)}px) rotateX(${(-cameraState.pitchX).toFixed(2)}deg) rotateY(${(-cameraState.yawY).toFixed(2)}deg) rotateZ(${(-cameraState.rollZ).toFixed(2)}deg)`;
      }
      if (cameraBlurNode) {
        cameraBlurNode.setAttribute('stdDeviation', `${Math.max(0, cameraState.shutterBlurX).toFixed(2)} ${Math.max(0, cameraState.shutterBlurY).toFixed(2)}`);
      }
      if (uiBlurNode) {
        uiBlurNode.setAttribute('stdDeviation', `0 ${Math.max(0, cameraState.uiBlurY).toFixed(2)}`);
      }
      if (heroBlurNode) {
        heroBlurNode.setAttribute('stdDeviation', `0 ${Math.max(0, cameraState.heroBlurY).toFixed(2)}`);
      }
    }

    // Render loop helper for SVG morphing path
    const morphPath = document.getElementById('morph-shape');

    function updateMorphPath() {
      if (!morphPath) return;

      if (morphData.isGrowing) {
        const d = `M ${morphData.leftX.toFixed(2)} 0 H ${morphData.rightX.toFixed(2)} V 2 H ${morphData.leftX.toFixed(2)} Z`;
        morphPath.setAttribute('d', d);
      } else {
        const cx = morphData.centerX;
        const cy = morphData.centerY;
        const rx = Math.max(0.1, morphData.radiusX * morphData.scaleX);
        const ry = Math.max(0.1, morphData.radiusY * morphData.scaleY);

        let d = '';
        if (morphData.cornerRadius > 0 && Math.abs(rx - ry) < 4) {
          const r = (rx + ry) / 2;
          d = `M ${cx - r} ${cy} A ${r} ${r} 0 1 0 ${cx + r} ${cy} A ${r} ${r} 0 1 0 ${cx - r} ${cy} Z`;
        } else {
          const w = rx;
          const h = ry;
          d = `M ${cx - w} ${cy - h} H ${cx + w} V ${cy + h} H ${cx - w} Z`;
        }
        morphPath.setAttribute('d', d);
      }

      morphPath.setAttribute('fill', morphData.fillColor);
      morphPath.setAttribute('fill-opacity', morphData.fillOpacity);

      if (blurFilterNode) {
        blurFilterNode.setAttribute('stdDeviation', `${morphData.blurX.toFixed(2)} ${morphData.blurY.toFixed(2)}`);
      }
    }

    // Letter-by-Letter Text Reveal Renderer
    const charElements = document.querySelectorAll('.char-unit');

    function updateTextReveal() {
      const currentIdx = textState.typeProgress;
      charElements.forEach((el, index) => {
        if (index <= currentIdx) {
          const dist = currentIdx - index;
          if (dist >= 1) {
            el.style.opacity = '1';
            el.style.color = '#174EA6';
            el.style.textShadow = '0 1px 1.5px rgba(255, 255, 255, 0.65)';
            el.style.transform = 'scale(1.0) translateY(0px)';
          } else {
            const frac = Math.max(0, dist);

        ctx.fill();
        ctx.restore();

        // Fluid gradient sheen inside search bar
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(barX, barY, barW, barH, barR);
        ctx.clip();

        const fluidInner = ctx.createRadialGradient(barX + barW * 0.35, barY + barH * 0.5, 0, barX + barW * 0.35, barY + barH * 0.5, barW * 0.6);
        fluidInner.addColorStop(0, 'rgba(138, 180, 248, 0.45)');
        fluidInner.addColorStop(0.5, 'rgba(66, 133, 244, 0.25)');
        fluidInner.addColorStop(1, 'rgba(26, 115, 232, 0)');
        ctx.fillStyle = fluidInner;
        ctx.fillRect(barX, barY, barW, barH);

        // Placeholder lines (left side)
        let placeholderAlpha = 1.0;
        if (t >= 0.8) placeholderAlpha = Math.max(0, 1 - (t - 0.8) / 0.3);
        if (placeholderAlpha > 0) {
          ctx.globalAlpha = placeholderAlpha;
          ctx.fillStyle = '#1A73E8';
          ctx.beginPath();
          ctx.roundRect(barX + 24 * scale, barY + 20 * scale, 32 * scale, 2 * scale, 1 * scale);
          ctx.roundRect(barX + 24 * scale, barY + 27 * scale, 44 * scale, 2 * scale, 1 * scale);
          ctx.roundRect(barX + 24 * scale, barY + 34 * scale, 22 * scale, 2 * scale, 1 * scale);
          ctx.fill();
        }

        // Typing Text Reveal
        if (t >= 0.85) {
          const textElapsed = t - 0.85;
          const chars = typedPrompt;
          const charInterval = 0.08;
          const visibleCount = Math.min(chars.length, Math.floor(textElapsed / charInterval));
          const subText = chars.substring(0, visibleCount);

          ctx.font = `600 ${19 * scale}px system-ui, -apple-system, sans-serif`;
          ctx.fillStyle = '#174EA6';
          ctx.textBaseline = 'middle';
          ctx.fillText(subText, barX + 24 * scale, centerY);

          // Blinking typing cursor
          if (t < 2.8) {
            const cursorX = barX + 24 * scale + ctx.measureText(subText).width + 3 * scale;
            const cursorAlpha = (Math.floor(t * 3.5) % 2 === 0) ? 0.9 : 0.2;
            ctx.fillStyle = `rgba(26, 115, 232, ${cursorAlpha})`;
            ctx.fillRect(cursorX, centerY - 11 * scale, 2 * scale, 22 * scale);
          }
        }

        // Refresh/Rewind Action Icon (right side)
        const iconX = barX + barW - 32 * scale;
        ctx.strokeStyle = '#1A73E8';
        ctx.lineWidth = 2 * scale;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(iconX, centerY, 7 * scale, 0.2 * Math.PI, 1.8 * Math.PI);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(iconX + 6 * scale, centerY - 8 * scale);
        ctx.lineTo(iconX + 6 * scale, centerY - 2 * scale);
        ctx.lineTo(iconX + 11 * scale, centerY - 5 * scale);
        ctx.stroke();

        ctx.restore();

        // Kinetic Morphing Accent Line & Dot
        const accentY = barY + barH + 20 * scale;
        ctx.save();
        if (morphData.isGrowing) {
          const lx = centerX - (barW / 2) + (morphData.leftX / 400) * barW;
          const rx = centerX - (barW / 2) + (morphData.rightX / 400) * barW;
          if (rx > lx) {
            ctx.strokeStyle = '#8AB4F8';
            ctx.lineWidth = 2.5 * scale;
            ctx.shadowColor = '#8AB4F8';
            ctx.shadowBlur = 8 * scale;
            ctx.beginPath();
            ctx.moveTo(lx, accentY);
            ctx.lineTo(rx, accentY);
            ctx.stroke();
          }
        } else {
          // Morphed dot/pill
          const cx = centerX - (barW / 2) + (morphData.centerX / 400) * barW;
          const cy = accentY + morphData.centerY * scale;
          const radX = Math.max(1, morphData.radiusX * scale);
          const radY = Math.max(1, morphData.radiusY * scale);

          ctx.fillStyle = '#8AB4F8';
          ctx.shadowColor = '#8AB4F8';
          ctx.shadowBlur = 10 * scale;
          ctx.beginPath();
          ctx.ellipse(cx, cy, radX, radY, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        ctx.restore();
      }

      // =========================================================================
      // SCENE 2 & 3: "EDITORS are cooked 😭" + 4 SHOWCASE CARDS (t: 4.0s to 10.5s)
      // =========================================================================
      if (t >= 4.0 && t < 10.6) {
        let scene2Alpha = 1.0;
        if (t < 4.8) scene2Alpha = (t - 4.0) / 0.8;
        else if (t >= 10.15) scene2Alpha = Math.max(0, 1 - (t - 10.15) / 0.4);

        ctx.save();
        ctx.globalAlpha = scene2Alpha;

        // Rising Fluid Gradient Wave from bottom (t: 4.88s to 6.3s)
        if (t >= 4.88 && t < 8.0) {
          const fluidH = Math.min(220 * scale, (t - 4.88) * 160 * scale);
          ctx.save();
          ctx.globalCompositeOperation = 'screen';
          const fluidG = ctx.createRadialGradient(centerX, resH, 0, centerX, resH, stageDim * 0.65);
          fluidG.addColorStop(0, 'rgba(138, 180, 248, 0.7)');
          fluidG.addColorStop(0.5, 'rgba(66, 133, 244, 0.45)');
          fluidG.addColorStop(1, 'rgba(26, 115, 232, 0)');
          ctx.fillStyle = fluidG;
          ctx.fillRect(0, resH - fluidH, resW, fluidH);
          ctx.restore();
        }

        // Ambient Backlight Aura in Scene 2
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const aura2 = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 340 * scale);
        aura2.addColorStop(0, 'rgba(66, 133, 244, 0.55)');
        aura2.addColorStop(0.4, 'rgba(26, 115, 232, 0.3)');
        aura2.addColorStop(0.75, 'rgba(23, 78, 166, 0)');
        ctx.fillStyle = aura2;
        ctx.fillRect(centerX - 340 * scale, centerY - 240 * scale, 680 * scale, 480 * scale);
        ctx.restore();

        // Expanding Arrival Shockwave (t: 4.92s to 5.72s)
        if (t >= 4.92 && t < 5.8) {
          const shockP = (t - 4.92) / 0.80;
          const shockR = (20 + shockP * 240) * scale;
          const shockAlpha = Math.max(0, 0.95 * (1 - shockP));
          ctx.save();
          ctx.strokeStyle = `rgba(138, 180, 248, ${shockAlpha})`;
          ctx.lineWidth = 3 * scale;
          ctx.shadowColor = '#4285F4';
          ctx.shadowBlur = 20 * scale;
          ctx.beginPath();
          ctx.arc(centerX, centerY, shockR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // --- TYPOGRAPHY: EDITORS are cooked 😭 ---
        // Docking animation at t >= 6.30s: moves smoothly to top-left (x: -160, y: -235, scale: 0.62)
        let titleX = centerX;
        let titleY = centerY - 25 * scale;
        let titleScale = 1.0;

        if (t >= 6.30 && t < 7.10) {
          const dockP = (t - 6.30) / 0.80;
          const easeDock = dockP < 0.5 ? 4 * dockP * dockP * dockP : 1 - Math.pow(-2 * dockP + 2, 3) / 2;
          titleX = centerX + (-160 * scale * easeDock);
          titleY = (centerY - 25 * scale) + (-210 * scale * easeDock);
          titleScale = 1.0 - (0.38 * easeDock);
        } else if (t >= 7.10) {
          titleX = centerX - 160 * scale;
          titleY = centerY - 235 * scale;
          titleScale = 0.62;
        }

        ctx.save();
        ctx.translate(titleX, titleY);
        ctx.scale(titleScale, titleScale);

        // "EDITORS" (Bold Display Sans 66px)
        if (t >= 4.88) {
          ctx.save();
          ctx.font = `900 ${66 * scale}px "Outfit", -apple-system, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(138, 180, 248, 0.65)';
          ctx.shadowBlur = 22 * scale;
          ctx.shadowOffsetY = 6 * scale;

          const edGrad = ctx.createLinearGradient(0, -35 * scale, 0, 35 * scale);
          edGrad.addColorStop(0, '#FFFFFF');
          edGrad.addColorStop(0.48, '#E8F0FE');
          edGrad.addColorStop(1, '#8AB4F8');
          ctx.fillStyle = edGrad;
          ctx.fillText(textEditors, 0, -32 * scale);
          ctx.restore();
        }

        // "are cooked" (Playfair Italic Serif 54px) + Crying Emoji 😭
        if (t >= 5.10) {
          ctx.save();
          ctx.font = `italic 700 ${54 * scale}px "Playfair Display", Georgia, serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(26, 115, 232, 0.75)';
          ctx.shadowBlur = 24 * scale;
          ctx.fillStyle = '#8AB4F8';
          
          const textOffset = -30 * scale;
          ctx.fillText(textCooked, textOffset, 32 * scale);

          // Crying Emoji 😭 with sorrow wobble bounce
          const emojiX = textOffset + ctx.measureText(textCooked).width / 2 + 38 * scale;
          const emojiY = 32 * scale;

          let wobbleRot = 0;
          let wobbleScale = 1.0;
          if (t >= 5.30 && t < 6.0) {
            const eb = (t - 5.30) / 0.70;
            wobbleScale = 1.0 + Math.sin(eb * Math.PI * 4) * 0.18;
            wobbleRot = Math.sin(eb * Math.PI * 3) * 0.15;
          }

          ctx.save();
          ctx.translate(emojiX, emojiY);
          ctx.rotate(wobbleRot);
          ctx.scale(wobbleScale, wobbleScale);
          ctx.font = `${52 * scale}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
          ctx.shadowBlur = 12 * scale;
          ctx.shadowColor = 'rgba(138, 180, 248, 0.6)';
          ctx.fillText(textEmoji, 0, 0);
          ctx.restore();

          // Teardrop falling motes
          if (t >= 5.26 && t < 6.2) {
            const tearP = ((t - 5.26) * 1.6) % 1.0;
            ctx.fillStyle = '#8AB4F8';
            ctx.shadowColor = '#8AB4F8';
            ctx.shadowBlur = 8 * scale;
            ctx.beginPath();
            ctx.ellipse(emojiX - 12 * scale, (emojiY + 12 * scale) + tearP * 35 * scale, 3.5 * scale, 5.5 * scale, 0, 0, Math.PI * 2);
            ctx.ellipse(emojiX + 12 * scale, (emojiY + 12 * scale) + ((tearP + 0.5) % 1) * 35 * scale, 3.5 * scale, 5.5 * scale, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        ctx.restore(); // End typography

        // --- 4 SHOWCASE CARDS (t: 6.40s to 10.15s) ---
        if (t >= 6.40) {
          let cardRevealP = Math.min(1, (t - 6.40) / 0.55);
          let cardMorphP = 0;
          if (t >= 7.10) {
            cardMorphP = Math.min(1, (t - 7.10) / 0.55);
          }

          // Card dimensions morphing from (270x145) to (228x228 square)
          const curW = (270 + cardMorphP * (228 - 270)) * scale;
          const curH = (145 + cardMorphP * (228 - 145)) * scale;
          const curR = (18 + cardMorphP * (22 - 18)) * scale;
          const gridGap = 16 * scale;

          // Grid center sits below docked headline
          const gridCenterY = centerY + 48 * scale;

          // Pre-launch dip at t: 9.75s to 10.15s
          let dipY = 0;
          let dipScale = 1.0;
          if (t >= 9.75 && t < 10.15) {
            const dipP = Math.sin(((t - 9.75) / 0.40) * Math.PI);
            dipY = dipP * 18 * scale;
            dipScale = 1.0 - dipP * 0.04;
          }

          ctx.save();
          ctx.translate(centerX, gridCenterY + dipY);
          ctx.scale(cardRevealP * dipScale, cardRevealP * dipScale);

          const cardPositions = [
            { x: -curW - gridGap / 2, y: -curH - gridGap / 2 },
            { x: gridGap / 2, y: -curH - gridGap / 2 },
            { x: -curW - gridGap / 2, y: gridGap / 2 },
            { x: gridGap / 2, y: gridGap / 2 }
          ];

          const animTime = Math.max(0, t - 7.65);

          cardPositions.forEach((pos, idx) => {
            ctx.save();
            ctx.translate(pos.x, pos.y);

            // Card Shadow
            ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
            ctx.shadowBlur = 32 * scale;
            ctx.shadowOffsetY = 16 * scale;

            // Card Background
            ctx.beginPath();
            ctx.roundRect(0, 0, curW, curH, curR);
            const cardBg = ctx.createLinearGradient(0, 0, 0, curH);
            cardBg.addColorStop(0, '#0F172A');
            cardBg.addColorStop(1, '#060E21');
            ctx.fillStyle = cardBg;
            ctx.fill();

            // Card Border
            ctx.strokeStyle = 'rgba(138, 180, 248, 0.28)';
            ctx.lineWidth = 1.5 * scale;
            ctx.stroke();

            // Inner Animated Motion Graphic per Card
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(0, 0, curW, curH, curR);
            ctx.clip();

            const cX = curW / 2;
            const cY = curH / 2;

            if (idx === 0) {
              // Card 1: Magnetic Attraction & Shockwave
              const loopT = (animTime * 1.2) % 2.4;
              let nOffset = 45 * scale;
              let shockR = 0;
              let shockOp = 0;

              if (loopT < 0.8) {
                const p = loopT / 0.8;
                nOffset = (45 - p * 15) * scale;
              } else if (loopT < 1.6) {
                const p = (loopT - 0.8) / 0.8;
                nOffset = (30 - p * 30) * scale;
                shockR = (15 + p * 65) * scale;
                shockOp = Math.max(0, 0.8 - p * 0.8);
              } else {
                const p = (loopT - 1.6) / 0.8;
                nOffset = (p * 45) * scale;
              }

              if (shockOp > 0) {
                ctx.strokeStyle = `rgba(138, 180, 248, ${shockOp})`;
                ctx.lineWidth = 2.5 * scale;
                ctx.beginPath();
                ctx.arc(cX, cY, shockR, 0, Math.PI * 2);
                ctx.stroke();
              }

              // Capsule Core
              ctx.fillStyle = '#E8F0FE';
              ctx.beginPath();
              ctx.roundRect(cX - 24 * scale, cY - 10 * scale, 48 * scale, 20 * scale, 10 * scale);
              ctx.fill();

              // Left & Right Nodes
              ctx.fillStyle = '#8AB4F8';
              ctx.beginPath();
              ctx.arc(cX - nOffset, cY, 6 * scale, 0, Math.PI * 2);
              ctx.arc(cX + nOffset, cY, 6 * scale, 0, Math.PI * 2);
              ctx.fill();
            } else if (idx === 1) {
              // Card 2: Orbiting Satellite & Concentric Rings
              ctx.strokeStyle = 'rgba(66, 133, 244, 0.4)';
              ctx.lineWidth = 1.5 * scale;
              ctx.beginPath();
              ctx.arc(cX, cY, 22 * scale, 0, Math.PI * 2);
              ctx.arc(cX, cY, 36 * scale, 0, Math.PI * 2);
              ctx.arc(cX, cY, 50 * scale, 0, Math.PI * 2);
              ctx.stroke();

              const orbAngle = animTime * 3.5;
              const ox = cX + Math.cos(orbAngle) * 36 * scale;
              const oy = cY + Math.sin(orbAngle) * 36 * scale;
              ctx.fillStyle = '#8AB4F8';
              ctx.shadowColor = '#8AB4F8';
              ctx.shadowBlur = 10 * scale;
              ctx.beginPath();
              ctx.arc(ox, oy, 6 * scale, 0, Math.PI * 2);
              ctx.fill();
            } else if (idx === 2) {
              // Card 3: Equalizer Waveform Lines
              ctx.strokeStyle = '#8AB4F8';
              ctx.lineWidth = 3 * scale;
              ctx.lineCap = 'round';
              for (let i = -3; i <= 3; i++) {
                const barH = (14 + Math.sin(animTime * 6 + i * 1.1) * 20) * scale;
                ctx.beginPath();
                ctx.moveTo(cX + i * 13 * scale, cY - barH / 2);
                ctx.lineTo(cX + i * 13 * scale, cY + barH / 2);
                ctx.stroke();
              }
            } else if (idx === 3) {
              // Card 4: Geometric Morphing Rotating Square
              ctx.save();
              ctx.translate(cX, cY);
              ctx.rotate(animTime * 1.5);
              ctx.strokeStyle = '#93C5FD';
              ctx.lineWidth = 2.5 * scale;
              ctx.strokeRect(-22 * scale, -22 * scale, 44 * scale, 44 * scale);
              ctx.restore();

              ctx.fillStyle = '#8AB4F8';
              ctx.beginPath();
              ctx.arc(cX, cY, (6 + Math.sin(animTime * 5) * 2) * scale, 0, Math.PI * 2);
              ctx.fill();
            }

            ctx.restore(); // End inner clip
            ctx.restore(); // End card
          });

          ctx.restore(); // End showcase stage
        }

        ctx.restore(); // End scene 2 & 3
      }

      // =========================================================================
      // SCENE 4 & 5: "comment more" + UNDERLINE MORPH + OUTRO (t: 10.2s to 14.0s)
      // =========================================================================
      if (t >= 10.2) {
        let scene4Alpha = 1.0;
        if (t < 11.0) scene4Alpha = (t - 10.2) / 0.8;

        // Cinematic Outro Pullback (t: 12.70s to 14.0s)
        let outroScale = 1.0;
        let outroAlpha = 1.0;
        if (t >= 12.70) {
          const outP = Math.min(1, (t - 12.70) / 1.30);
          outroScale = Math.max(0.0001, Math.pow(1 - outP, 4.0));
          outroAlpha = Math.max(0, 1 - outP);
        }

        ctx.save();
        ctx.globalAlpha = scene4Alpha * outroAlpha;
        ctx.translate(centerX, centerY);
        ctx.scale(outroScale, outroScale);

        // Ambient Backlight Bloom in Zone 3
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const auraFinal = ctx.createRadialGradient(0, 0, 0, 0, 0, 300 * scale);
        auraFinal.addColorStop(0, 'rgba(138, 180, 248, 0.7)');
        auraFinal.addColorStop(0.45, 'rgba(66, 133, 244, 0.48)');
        auraFinal.addColorStop(0.75, 'rgba(26, 115, 232, 0.25)');
        auraFinal.addColorStop(1, 'rgba(23, 78, 166, 0)');
        ctx.fillStyle = auraFinal;
        ctx.fillRect(-300 * scale, -200 * scale, 600 * scale, 400 * scale);
        ctx.restore();

        // "comment" (Outfit 800 Bold Sans 52px)
        if (t >= 11.08) {
          ctx.save();
          ctx.font = `800 ${52 * scale}px "Outfit", "Syne", -apple-system, sans-serif`;
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(138, 180, 248, 0.6)';
          ctx.shadowBlur = 20 * scale;
          
          const commGrad = ctx.createLinearGradient(0, -26 * scale, 0, 26 * scale);
          commGrad.addColorStop(0, '#FFFFFF');
          commGrad.addColorStop(0.48, '#E8F0FE');
          commGrad.addColorStop(1, '#8AB4F8');
          ctx.fillStyle = commGrad;
          ctx.fillText(textComment, -10 * scale, -10 * scale);
          ctx.restore();
        }

        // "more" (Playfair Italic Serif 58px)
        if (t >= 11.28) {
          ctx.save();
          ctx.font = `italic 700 ${58 * scale}px "Playfair Display", Georgia, serif`;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(26, 115, 232, 0.7)';
          ctx.shadowBlur = 22 * scale;
          ctx.fillStyle = '#8AB4F8';
          ctx.fillText(textMore, 10 * scale, -10 * scale);
          ctx.restore();
        }

        // Dynamic Underline Track: Dot morphs & stretches into a glowing rectangular underline bar
        if (t >= 11.85) {
          const trackW = 340 * scale;
          const trackH = 4.5 * scale;
          const trackY = 32 * scale;

          let underP = Math.min(1, Math.max(0, (t - 11.85) / 0.55));
          const barLength = Math.max(10 * scale, underP * trackW);

          ctx.save();
          ctx.shadowColor = '#8AB4F8';
          ctx.shadowBlur = 14 * scale;
          ctx.fillStyle = '#8AB4F8';
          ctx.beginPath();
          ctx.roundRect(-barLength / 2, trackY, barLength, trackH, 2.5 * scale);
          ctx.fill();

          // Specular light sheen sweep across the underline
          if (t >= 12.35 && t < 12.75) {
            const sheenP = (t - 12.35) / 0.40;
            const sheenX = -trackW / 2 + sheenP * (trackW + 40 * scale);
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(-barLength / 2, trackY, barLength, trackH, 2.5 * scale);
            ctx.clip();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.fillRect(sheenX - 20 * scale, trackY, 40 * scale, trackH);
            ctx.restore();
          }

          ctx.restore();
        }

        ctx.restore(); // End scene 4 & 5
      }

      ctx.restore(); // End main
    };

    // Fast PNG DataURL / Blob generator for export harness
    window.getFramePNGDataUrl = function(frame, resW, resH) {
      const offCanvas = document.createElement('canvas');
      offCanvas.width = resW;
      offCanvas.height = resH;
      window.renderFrameToCanvas(frame, offCanvas, resW, resH);
      return offCanvas.toDataURL('image/png');
    };

    // Auto play preview if viewed directly
    if (window.self === window.top) {
      tl.play();
    }
  </script>
</body>
